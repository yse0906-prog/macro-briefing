# 07:00 루틴이 끝났어야 할 12:00(KST)에 오늘 파일이 있는지만 본다. Claude 토큰은 쓰지 않는다.
# 파일이 없을 때만 routine-retry 라벨을 붙인 이슈를 만들어 Claude 루틴을 한 번 다시 깨운다(하루 최대 1회).
# 주로 사용량 한도로 아침 실행이 중단된 날을 위한 것이다.
name: Retry routine if today's file is missing

on:
  schedule:
    - cron: "0 3 * * 1-6"   # 12:00 KST, 월~토
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check today's file and request one retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          DOW=$(TZ=Asia/Seoul date +%u)
          case "$DOW" in
            [1-5]) FILE="data/sectors/$TODAY.json" ;;
            6) FILE="data/briefings/$TODAY.json" ;;
            *) echo "일요일: 확인할 파일 없음"; exit 0 ;;
          esac
          if [ -f "$FILE" ]; then
            echo "있음: $FILE — 재실행하지 않음"
            exit 0
          fi
          TITLE="routine-retry $TODAY"
          COUNT=$(gh issue list --state all --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$COUNT" != "0" ]; then
            echo "오늘은 이미 재실행을 요청함"
            exit 0
          fi
          URL=$(gh issue create --title "$TITLE" --body "07:00 루틴 이후 $FILE 이 없어 루틴을 한 번 다시 실행합니다.")
          gh issue edit "$URL" --add-label routine-retry
          gh issue close "$URL" --comment "재실행 요청 완료. 결과는 몇 분 뒤 커밋으로 확인하세요."
          echo "재실행 요청: $URL"
